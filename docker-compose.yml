version: '3.8'

networks:
  swarm-network:
    driver: bridge

volumes:
  redis_data:
  model_cache:

services:
  # ==========================================
  # 1. OMNI-COORDINATOR & GRAPHQL/API ROUTER
  # ==========================================
  omni-coordinator:
    build:
      context: .
      dockerfile: deploy/Dockerfile.omni
    container_name: ivytech_omni_coordinator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - CLUSTER_NAME=ivytech-nexus-omni-cluster
      - FACULTY_ROSTER=Gemini-Pro-Thinking,Claude-Code,Codex,Cursor,ChatGPT,Grok,Copilot,Perplexity
      - REDIS_URL=redis://redis-queue:6379/0
      - WEB3_RPC_URL=https://mainnet.infura.io/v3/YOUR_INFURA_PROJECT_ID
    depends_on:
      - redis-queue
    networks:
      - swarm-network

  # ==========================================
  # 2. SWARM WORKER NODE (credkellar/swarm-worker)
  # ==========================================
  swarm-worker-node:
    image: credkellar/swarm-worker:latest
    container_name: ivytech_professor_worker_node
    restart: unless-stopped
    environment:
      - WORKER_ROLE=professor_developer_engineer_cluster
      - GPU_ACCELERATION=enabled
      - REDIS_URL=redis://redis-queue:6379/0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute]
    volumes:
      - model_cache:/root/.cache/huggingface
    networks:
      - swarm-network

  # ==========================================
  # 3. GOOGLE-FLOWX CINEMATIC & NNL RENDERER
  # ==========================================
  flowx-cinematic-renderer:
    build:
      context: .
      dockerfile: deploy/Dockerfile.omni
    container_name: ivytech_flowx_renderer
    restart: unless-stopped
    command: ["python3", "-c", "import time; print('[FlowX] Cinematic Renderer Pipeline Ready.'); [time.sleep(60) for _ in range(99999)]"]
    environment:
      - PIPELINE=Google-FlowX
      - RENDER_NODES=8
      - TARGET_RESOLUTION=4K
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute]
    networks:
      - swarm-network

  # ==========================================
  # 4. REDIS DISTRIBUTED TASK QUEUE
  # ==========================================
  redis-queue:
    image: redis:7.2-alpine
    container_name: ivytech_redis_queue
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - swarm-network

  # ==========================================
  # 5. AUTONOMOUS SECURITY HONEYPOT
  # ==========================================
  security-honeypot:
    build:
      context: .
      dockerfile: deploy/Dockerfile.omni
    container_name: ivytech_security_honeypot
    restart: unless-stopped
    command: ["python3", "-c", "from cybersecurity.honeypot_node_simulator import SwarmSecurityHoneypot; h = SwarmSecurityHoneypot(); print('[Honeypot] Decoy mesh node listening on port 9999.')"]
    ports:
      - "9999:9999"
    networks:
      - swarm-network
