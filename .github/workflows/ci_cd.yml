name: IvyTech Nexus Omni-Swarm CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Faculty & Pipeline Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest flake8

      - name: Lint Codebase with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

      - name: Execute Omni-Swarm Test Suite
        env:
          PYTHONPATH: .
          MODEL_NAME: meta-llama/Llama-3.2-3B-Instruct
          SWARM_MODE: test
        run: |
          pytest tests/ --maxfail=1 --disable-warnings -v

  docker-build-and-push:
    name: Build & Deploy to Docker Hub (`credkellar/swarm-worker`)
    needs: lint-and-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: credkellar
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Omni-Swarm Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.omni
          push: true
          tags: |
            credkellar/swarm-worker:latest
            credkellar/swarm-worker:omni-release-v2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
